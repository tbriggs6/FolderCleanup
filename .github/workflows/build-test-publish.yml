name: Build, Test, Publish

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore UtilitySuite.sln

      - name: Build
        run: dotnet build UtilitySuite.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test UtilitySuite.sln --configuration Release --no-build

      - name: Publish Windows executable
        run: >
          dotnet publish src/UtilitySuite.App/UtilitySuite.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/UtilitySuite-win-x64

      - name: Upload published executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtilitySuite-win-x64
          path: artifacts/UtilitySuite-win-x64/**
          if-no-files-found: error
